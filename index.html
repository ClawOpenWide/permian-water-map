<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permian Basin Water Infrastructure</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
        
        .header { background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); padding: 12px 15px; border-bottom: 2px solid #e94560; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.2rem; color: #fff; }
        .header p { display: none; }
        .menu-toggle { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 5px; }
        
        .container { display: flex; height: calc(100vh - 56px); }
        
        #map { flex: 1; height: 100%; }
        
        .sidebar { width: 380px; background: #16213e; overflow-y: auto; border-left: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px 15px; background: #0f3460; position: sticky; top: 0; z-index: 10; }
        .sidebar-header h2 { font-size: 1rem; color: #e94560; }
        .filter-row { display: flex; gap: 6px; padding: 10px 15px; background: #1a1a2e; flex-wrap: wrap; }
        .filter-btn { padding: 6px 10px; border: 1px solid #444; background: #0f3460; color: #ccc; border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; flex: 1; min-width: 60px; text-align: center; }
        .filter-btn:hover { border-color: #e94560; }
        .filter-btn.active { background: #e94560; color: #fff; border-color: #e94560; }
        
        .station-list { padding: 10px; flex: 1; overflow-y: auto; }
        .station-card { background: #0f3460; border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 4px solid #e94560; }
        .station-card.brine { border-left-color: #4ade80; }
        .station-card.swd { border-left-color: #ffd700; }
        .station-card.fresh { border-left-color: #00d9ff; }
        
        .station-type { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .station-type.water { background: #e94560; color: #fff; }
        .station-type.brine { background: #4ade80; color: #000; }
        .station-type.swd { background: #ffd700; color: #000; }
        .station-type.fresh { background: #00d9ff; color: #000; }
        
        .station-name { font-weight: bold; font-size: 0.9rem; margin-bottom: 3px; }
        .station-location { color: #aaa; font-size: 0.8rem; }
        .station-coords { display: none; }
        .station-notes { color: #888; font-size: 0.75rem; margin-top: 4px; font-style: italic; }
        
        .legend { padding: 12px 15px; background: #16213e; border-top: 1px solid #333; }
        .legend h3 { font-size: 0.85rem; margin-bottom: 8px; color: #e94560; }
        .legend-items { display: flex; gap: 12px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        
        .stats { display: flex; gap: 15px; padding: 10px 15px; background: #1a1a2e; border-bottom: 1px solid #333; }
        .stat { text-align: center; flex: 1; }
        .stat-num { font-size: 1.2rem; font-weight: bold; color: #e94560; }
        .stat-label { font-size: 0.65rem; color: #888; text-transform: uppercase; }

        /* Mobile Styles */
        @media (max-width: 768px) {
            body { overflow: auto; }
            .menu-toggle { display: block; }
            .header h1 { font-size: 1rem; }
            .container { flex-direction: column; height: auto; }
            #map { height: 45vh; min-height: 300px; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid #333; }
            .sidebar.closed { display: none; }
            .station-list { max-height: none; }
            .stats { flex-wrap: wrap; gap: 10px; }
            .stat-num { font-size: 1rem; }
            .legend-items { gap: 10px; }
            .legend-item { font-size: 0.65rem; }
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        
        .stats { display: flex; gap: 20px; padding: 10px 15px; background: #1a1a2e; border-bottom: 1px solid #333; }
        .stat { text-align: center; }
        .stat-num { font-size: 1.4rem; font-weight: bold; color: #e94560; }
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        
        .leaflet-popup-content-wrapper { background: #16213e; color: #eee; }
        .leaflet-popup-tip { background: #16213e; }
        
        .state-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; margin-left: 8px; }
        .state-badge.tx { background: #ef4444; color: #fff; }
        .state-badge.nm { background: #22c55e; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Permian Basin Water Infrastructure</h1>
            <p>Non-Potable Water Stations, Brine Stations, SWDs  (TX + NM)</p>
        </div>
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    </div>
    
    <div class="container">
        <div id="map"></div>
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Water Infrastructure</h2>
            </div>
            <div class="stats">
                <div class="stat"><div class="stat-num">16</div><div class="stat-label">Water Stations</div></div>
                <div class="stat"><div class="stat-num">26</div><div class="stat-label">Brine Points</div></div>
                <div class="stat"><div class="stat-num">24</div><div class="stat-label">SWDs/Companies</div></div>
            </div>
            <div class="filter-row">
                <button class="filter-btn active" onclick="filterStations('all')">All</button>
                <button class="filter-btn" onclick="filterStations('water')">Water</button>
                <button class="filter-btn" onclick="filterStations('brine')">Brine</button><button class="filter-btn" onclick="filterStations('fresh')">Fresh</button>
                <button class="filter-btn" onclick="filterStations('swd')">SWD</button>
            </div>
            <div class="station-list" id="stationList"></div>
            <div class="legend">
                
                <div class="legend-items">
                    <div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>Non-Potable Water</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#00d9ff"></div>Fresh Water</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>Brine</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#ffd700"></div>SWD Company</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Station data - Updated with New Mexico

    <script>
        const SUPABASE_URL = 'https://cqfvypmrogoootehsdfh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxZnZ5cG1yb2dvb290ZWhzZGZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2Mzk1ODcsImV4cCI6MjA5MTIxNTU4N30.rGxaQsZhyjy7gaw7ZHmAVyKW1phQP2Ea4ZhHuWBeH_Q';
        
        let stations = [];
        let markers = [];
        let currentFilter = 'all';

        async function loadStations() {
            try {
                const response = await fetch(SUPABASE_URL + '/rest/v1/stations?select=*&lat=not.is.null&lng=not.is.null', {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });
                stations = await response.json();
                console.log('Loaded ' + stations.length + ' stations from database');
                renderStations();
                updateStats();
            } catch (error) { console.error('Error loading stations:', error); }
        }

        function updateStats() {
            const water = stations.filter(s => s.type === 'water' || s.type === 'fresh').length;
            const brine = stations.filter(s => s.type === 'brine').length;
            const swd = stations.filter(s => s.type === 'swd').length;
            const els = document.querySelectorAll('.stat-num');
            if(els[0]) els[0].textContent = water;
            if(els[1]) els[1].textContent = brine;
            if(els[2]) els[2].textContent = swd;
        }

        function createMarker(station) {
            const colors = { 'water': '#e94560', 'fresh': '#00d9ff', 'brine': '#4ade80', 'swd': '#ffd700' };
            const marker = L.circleMarker([station.lat, station.lng], { radius: 8, fillColor: colors[station.type]||'#e94560', color: '#fff', weight: 2, fillOpacity: 0.8 });
            marker.bindPopup("<strong>"+station.name+"</strong><br>"+(station.type||'Brine')+"<br>"+(station.description||station.notes||''));
            return marker;
        }

        function renderStations() {
            document.getElementById('stationList').innerHTML = '';
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            const filtered = currentFilter === 'all' ? stations : stations.filter(s => {
                const d = (s.description||s.notes||'').toLowerCase();
                if(currentFilter === 'water') return s.type === 'water';
                if(currentFilter === 'fresh') return s.type === 'fresh' || s.has_fresh === true;
                if(currentFilter === 'brine') return s.type === 'brine' || s.has_brine === true;
                if(currentFilter === 'swd') return s.type === 'swd';
                return true;
            });
            filtered.forEach(s => {
                if(!s.lat||!s.lng) return;
                const m = createMarker(s);
                m.addTo(map);
                markers.push(m);
                const c = document.createElement('div');
                let bc = '';
                if(currentFilter==='fresh') bc='border-left-color:#00d9ff;';
                else if(currentFilter==='brine') bc='border-left-color:#4ade80;';
                else if(currentFilter==='water') bc='border-left-color:#e94560;';
                else if(currentFilter==='swd') bc='border-left-color:#ffd700;';
                c.className = 'station-card '+(s.type||'brine').toLowerCase();
                if(bc) c.style.cssText = bc;
                const tn = s.type==='water' ? 'Non-Potable' : (s.type ? s.type.charAt(0).toUpperCase()+s.type.slice(1) : 'Brine');
                let badges = '';
if(s.has_brine) badges += '<span class="station-type brine">Brine</span>';
if(s.has_fresh) badges += '<span class="station-type fresh">Fresh</span>';
c.innerHTML = '<span class="station-type '+(s.type||'brine').toLowerCase()+'">'+tn+'</span><span class="state-badge '+(s.state||'TX').toLowerCase()+'">'+(s.state||'TX')+'</span><div class="station-name">'+s.name+'</div><div class="station-location">'+(s.county||'')+', '+(s.state||'TX')+'</div><div class="station-badges">'+badges+'</div>';
                c.onclick = () => map.setView([s.lat, s.lng], 10);
                document.getElementById('stationList').appendChild(c);
            });
        }

        function filterStations(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn[onclick*="'+type+'"]').classList.add('active');
            renderStations();
        }

        const map = L.map('map').setView([32.5, -103.5], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OpenStreetMap'}).addTo(map);
        loadStations();
    </script>
</body>
</html>
