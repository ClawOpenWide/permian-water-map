        .header { background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); padding: 12px 15px; border-bottom: 2px solid #e94560; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .header h1 { font-size: 1.2rem; color: #fff; }
        .header p { display: none; }
        .menu-toggle { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 5px; }
        
        .container { display: flex; height: calc(100vh - 56px); }
        
        #map { flex: 1; height: 100%; }
        
        .sidebar { width: 380px; background: #16213e; overflow-y: auto; border-left: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px 15px; background: #0f3460; position: sticky; top: 0; z-index: 10; }
        .sidebar-header h2 { font-size: 1rem; color: #aaa; }
        .filter-row { display: flex; gap: 6px; padding: 10px 15px; background: #1a1a2e; flex-wrap: wrap; }
        .filter-btn { padding: 6px 10px; border: 1px solid #444; background: #0f3460; color: #ccc; border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; flex: 1; min-width: 60px; text-align: center; }
        .filter-btn:hover { border-color: #e94560; }
        .filter-btn.active { background: #e94560; color: #fff; border-color: #e94560; }
        
        .station-list { padding: 10px; flex: 1; overflow-y: auto; }
        .station-card { background: #0f3460; border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 4px solid #e94560; }
        .station-card.non-potable-water { border-left-color: #e94560; }
        .station-card.fresh-water { border-left-color: #00d9ff; }
        .station-card.brine { border-left-color: #4ade80; }
        .station-card.swd { border-left-color: #ffd700; }
        .station-card.water-hauler, .station-card.water-hauler\/disposal { border-left-color: #f472b6; }
        
        .station-type { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .station-type.water { background: #e94560; color: #fff; }
        .station-type.brine { background: #4ade80; color: #000; }
        .station-type.swd { background: #ffd700; color: #000; }
        .station-type.fresh { background: #00d9ff; color: #000; }
        .station-type.hauler { background: #f472b6; color: #fff; }
        
        .station-name { font-weight: bold; font-size: 0.9rem; margin-bottom: 3px; }
        .station-location { color: #aaa; font-size: 0.8rem; }
        .station-coords { display: none; }
        .station-notes { color: #888; font-size: 0.75rem; margin-top: 4px; font-style: italic; }
        
        .legend { padding: 12px 15px; background: #16213e; border-top: 1px solid #333; }
        .legend h3 { font-size: 0.85rem; margin-bottom: 8px; color: #e94560; }
        .legend-items { display: flex; gap: 12px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        
        .stats { display: flex; gap: 15px; padding: 10px 15px; background: #1a1a2e; border-bottom: 1px solid #333; }
        .stat { text-align: center; flex: 1; }
        .stat-num { font-size: 1.2rem; font-weight: bold; color: #aaa; }
        .stat-label { font-size: 0.65rem; color: #888; text-transform: uppercase; }

        /* Mobile Styles */
        @media (max-width: 768px) {
            body { overflow: auto; }
            .header h1 { font-size: 1rem; }
            .container { flex-direction: column; height: auto; }
            #map { height: 45vh; min-height: 300px; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid #333; }
            .station-list { max-height: none; }
            .stats { flex-wrap: wrap; gap: 10px; }
            .stat-num { font-size: 1rem; }
            .legend-items { gap: 10px; }
            .legend-item { font-size: 0.65rem; }
        }
        
        /* Mobile menu - always available */
        .mobile-menu { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #16213e; border-bottom: 1px solid #333; padding: 10px; z-index: 1000; }
        .mobile-menu.open { display: block; }
        .mobile-menu-item { padding: 10px; color: #eee; border-bottom: 1px solid #333; cursor: pointer; text-align: right; }
        .mobile-menu-item:hover { background: #0f3460; }
        
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        
        .stats { display: flex; gap: 20px; padding: 10px 15px; background: #1a1a2e; border-bottom: 1px solid #333; }
        .stat { text-align: center; }
        .stat-num { font-size: 1.4rem; font-weight: bold; color: #aaa; }
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        
        .leaflet-popup-content-wrapper { background: #16213e; color: #eee; }
        .leaflet-popup-tip { background: #16213e; }
        
        .state-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; margin-left: 8px; }
        .state-badge.tx { background: #ef4444; color: #fff; }
        .state-badge.nm { background: #555; color: #fff; }
        
        /* Detail Modal */

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; }
        .modal-overlay.open { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #16213e; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 20px; border: 1px solid #333; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .modal-header h2 { font-size: 1.1rem; color: #fff; }
        .modal-close { background: none; border: none; color: #aaa; font-size: 1.5rem; cursor: pointer; }
        .detail-section { margin-bottom: 15px; }

        .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #222; }
        .detail-label { color: #888; font-size: 0.85rem; }
        .detail-value { color: #fff; font-size: 0.85rem; font-weight: bold; }
        .directions-btn { display: block; width: 100%; padding: 14px; background: #4ade80; color: #000; text-align: center; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 1rem; margin-top: 10px; }
        .directions-btn:hover { background: #3bcf70; }
        .history-chart { height: 120px; background: #0f3460; border-radius: 6px; padding: 10px; margin-top: 8px; }
        .chart-bars { display: flex; align-items: flex-end; justify-content: space-around; height: 80px; gap: 4px; }
        .chart-bar { flex: 1; background: #4ade80; border-radius: 2px 2px 0 0; min-height: 4px; position: relative; }
        .chart-bar::after { content: attr(data-value); position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; color: #888; }
        .chart-labels { display: flex; justify-content: space-around; margin-top: 8px; font-size: 0.65rem; color: #666; }
        .wait-time { color: #ffd700; font-weight: bold; }
        .login-prompt { text-align: center; padding: 30px 20px; color: #888; }

        .login-options { display: flex; flex-direction: column; gap: 12px; max-width: 280px; margin: 0 auto; }
        .login-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 20px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; text-decoration: none; cursor: pointer; border: none; width: 100%; }

        .history-toggle-btn.active { background: #4ade80; color: #000; border-color: #4ade80; }

        let markers = [];
        let currentFilter = 'all';

        function getMarkerColor(type) {
            return colors[type] || '#e94560';
        }

        function createMarker(station) {
            const color = getMarkerColor(station.type);
            const markerHtml = `
                <div style="background:${color};width:16px;height:16px;border-radius:50%;border:2px solid #333;box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>
            `;
            
            const icon = L.divIcon({
                html: markerHtml,
                className: 'custom-marker',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            
            const marker = L.marker([station.lat, station.lng], { icon: icon });
            
            const popupContent = `
                <div style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
                    <strong style="font-size:14px;">${station.name}</strong><br>
                    <span style="color:#888;font-size:12px;">${station.county}, ${station.state}</span><br>
                    <span style="color:#666;font-size:11px;">${station.notes}</span><br>
                    <span style="color:#4ade80;font-size:10px;">Tap for details</span>
                </div>
            `;
            
            marker.bindPopup(popupContent);
            marker.stationType = station.type;
            return marker;
        }

        function renderStations() {
            const list = document.getElementById('stationList');
            list.innerHTML = '';
            if (!stations) {
                return;
            }
            
            // Clear existing markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            
            const filtered = currentFilter === 'all' 
                ? stations 
                : stations.filter(s => {
                    if (currentFilter === 'water') return s.type === 'Non-Potable Water' || s.type === 'Fresh Water';
                    if (currentFilter === 'brine') return s.type === 'Brine';
                    if (currentFilter === 'swd') return s.type === 'SWD';
                    if (currentFilter === 'hauler') return s.type === 'Water Hauler' || s.type === 'Water Hauler/Disposal';
                    return true;
                });
            
            try {
            filtered.forEach(station => {
                // Skip stations without valid coordinates
                if (!station.lat || !station.lng) {
                    console.log('Skipping:', station.name, '- no coordinates');
                    return;
                }
                
                console.log('Adding station:', station.name);
                
                // Add to map
                const marker = createMarker(station);
                marker.addTo(map);
                markers.push(marker);
                
                // Add to sidebar
                const dbData = (typeof dbStations !== 'undefined' ? dbStations : {})[station.name] || {};
                const card = document.createElement('div');
                card.className = 'station-card ' + station.type.toLowerCase().replace(/\s+/g, '-');
                card.innerHTML = `
                    <span class="station-type ${station.type.toLowerCase().replace(/\s+/g, '-')}">${station.type === 'Non-Potable Water' ? 'Non-Potable' : station.type}</span>
                    <span class="state-badge ${station.state.toLowerCase()}">${station.state}</span>
                    <div class="station-name">${station.name}</div>
                    <div class="station-location">${station.county}, ${station.state}</div>
                    <div class="station-notes">${station.notes}</div>
                    <div class="tap-hint">Tap for details</div>
                `;
                card.addEventListener('click', function() {
                    alert('CLICK: ' + station.name + ' - ready=' + (typeof window.openStationDetail === 'function'));
                    window.openStationDetail(station, dbData);
                });
                list.appendChild(card);
            });
            } catch(e) {
                console.log('Error rendering stations:', e);
            }
        }

            const body = document.getElementById('detailBody');
            
            title.textContent = 'Sign In';
            body.innerHTML = '<div class="login-prompt"><p>Sign in to view station details, live levels, and wait times.</p><div class="login-options"><button class="login-btn google" onclick="signInWithGoogle()"><svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Continue with Google</button><button class="login-btn email" onclick="showEmailLoginForm()">Continue with Email</button></div></div>';
            
            modal.classList.add('open');
        }
        
        // Close modal on outside click
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                closeDetailModal();
            }
        });
        
        // Auth functions
        async function signInWithGoogle() {
            try {
                await loadSupabase();
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.href }
                });
                if (error) alert('Error: ' + error.message);
            } catch (e) {
                alert('Failed to load authentication');
            }
        }
        
        let showingSignup = false;
        
        function showEmailLoginForm() {
            const body = document.getElementById('detailBody');
            body.innerHTML = '<div class="login-prompt"><p>' + (showingSignup ? 'Create your account' : 'Sign in to your account') + '</p><div class="email-login-form"><input type="email" id="loginEmail" placeholder="Email"><input type="password" id="loginPassword" placeholder="Password"><button onclick="' + (showingSignup ? 'handleEmailSignup()' : 'handleEmailLogin()') + '">' + (showingSignup ? 'Create Account' : 'Sign In') + '</button></div><div class="create-account-link">' + (showingSignup ? '<a onclick="showEmailLoginForm()">Already have an account? Sign In</a>' : '<a onclick="showSignupForm()">Don\'t have an account? Create one</a>') + '</div></div>';
            showingSignup = false;
        }
        
        function showSignupForm() {
            showingSignup = true;
            showEmailLoginForm();
        }
        
        async function handleEmailLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }
            try {
                await loadSupabase();
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert('Error: ' + error.message);
            } catch (e) {
                alert('Failed to load authentication');
            }
        }
        
        async function handleEmailSignup() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password || password.length < 6) {
                alert('Please enter email and valid password (min 6 chars)');
                return;
            }
            try {
                await loadSupabase();
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    alert('Error: ' + error.message);
                } else {
                    alert('Check your email to confirm your account!');
                    showingSignup = false;
                    showEmailLoginForm();
                }
            } catch (e) {
                alert('Failed to load authentication');
            }
        }
        
        // Listen for auth changes
        async function initAuth() {
            try {
                await loadSupabase();
                supabase.auth.onAuthStateChange((event, session) => {
                    currentUser = session?.user || null;
                    updateMenuAuth();
                    if (lastOpenedStation) {
                        const dbData = dbStations[lastOpenedStation.name] || {};
                        openStationDetail(lastOpenedStation, dbData);
                    }
                });
                // Also check initial session
                const { data: { session } } = await supabase.auth.getSession();
                currentUser = session?.user || null;
                updateMenuAuth();
            } catch (e) {
                console.log('Auth init error:', e);
            }
        }
        
        function updateMenuAuth() {
            const signInItem = document.getElementById('authMenuItem');
            if (signInItem) {
                if (currentUser) {
                    signInItem.textContent = 'Log Out';
                    signInItem.onclick = function() { handleLogout(); };
                } else {
                    signInItem.textContent = 'Sign In';
                    signInItem.onclick = function() { openLoginModal(); };
                }
            }
        }
        
        async function handleLogout() {
            try {
                await loadSupabase();
                await supabase.auth.signOut();
                currentUser = null;
                updateMenuAuth();
                closeDetailModal();
            } catch (e) {
                console.log('Logout error:', e);
            }
        }
    </script>
</body>
</html>
